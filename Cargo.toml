[package]
name = "vite-plus-commitlint"
version = "1.1.3"
edition = "2021"
description = "High performance Rust commitlint engine and NAPI bindings for Vite+"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "commitlint-rs"
path = "src/main.rs"

[features]
default = []
napi-binding = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = [
  "napi4",
  "serde-json",
], optional = true }
napi-derive = { version = "2.16.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[build-dependencies]
napi-build = "2.1.3"
